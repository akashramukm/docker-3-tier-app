<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker 3-Tier Application</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
        }

        h2 {
            color: #06b6d4;
        }

        .status {
            background: #064e3b;
            color: #34d399;
            padding: 12px;
            margin: 20px 0;
        }

        input {
            padding: 10px;
            width: 65%;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
        }

        button {
            padding: 10px;
            background: #06b6d4;
            border: none;
            cursor: pointer;
        }

        .item {
            background: #334155;
            padding: 12px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Docker Compose 3-Tier App</h2>

    <p>Frontend (Nginx) → API (FastAPI) → Database (PostgreSQL)</p>

    <div class="status" id="status">
        Checking connection...
    </div>

    <h4>ADD DATABASE RECORD</h4>

    <input type="text" id="itemName"
           placeholder="Enter item name...">

    <button onclick="addItem()">Add</button>

    <h4>SAVED ITEMS FROM DATABASE</h4>

    <div id="items"></div>

</div>

<script>

async function checkHealth() {
    try {
        const response = await fetch('/api/health');
        const data = await response.json();

        document.getElementById('status').innerText =
            'Status: ' + data.status +
            ' | DB: ' + data.database;

    } catch (error) {
        document.getElementById('status').innerText =
            'Connection failed';
    }
}

async function loadItems() {
    try {
        const response = await fetch('/api/items');
        const items = await response.json();

        const container = document.getElementById('items');
        container.innerHTML = '';

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item';
            div.textContent = item.name + ' | ID: ' + item.id;
            container.appendChild(div);
        });

    } catch (error) {
        console.error(error);
    }
}

async function addItem() {
    const input = document.getElementById('itemName');
    const name = input.value.trim();

    if (!name) {
        alert('Please enter an item name');
        return;
    }

    const response = await fetch('/api/items', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({name: name})
    });

    if (response.ok) {
        input.value = '';
        loadItems();
    } else {
        alert('Unable to add item');
    }
}

checkHealth();
loadItems();

</script>

</body>
</html>
